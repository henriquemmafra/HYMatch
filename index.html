<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080B14" />
  <title>HYMatch</title>
  <style>
    html,body{margin:0;min-height:100%;background:#080B14;color:#E8EAF0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh}
    #status{font-size:14px;color:#8891A6}
  </style>
</head>
<body>
  <div id="status">Loading HYMatch…</div>
  <script>
    (async () => {
      try {
        const base = "./chunks/";
        const names = Array.from({ length: 10 }, (_, i) => `part${String(i).padStart(2, "0")}.txt`);
        const parts = [];
        for (const name of names) {
          const response = await fetch(base + name + "?v=2", { cache: "no-store" });
          if (!response.ok) throw new Error(`${name}: ${response.status}`);
          parts.push(await response.text());
        }
        const html = parts.join("");
        const blob = new Blob([html], { type: "text/html" });
        location.replace(URL.createObjectURL(blob));
      } catch (error) {
        document.getElementById("status").textContent = "HYMatch could not load. Refresh the page.";
        console.error(error);
      }
    })();
  </script>
</body>
</html>
